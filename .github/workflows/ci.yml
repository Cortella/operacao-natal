name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Mesmo ambiente do desenvolvimento local: PostgreSQL e storage S3 via Docker.
      - run: cp .env.example .env
      - run: docker compose up -d
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Aguardar banco
        run: |
          for i in $(seq 1 30); do
            docker compose exec -T db pg_isready -U noel -d oficina_do_noel && exit 0
            sleep 2
          done
          docker compose logs
          exit 1
      - run: npm run storage:init
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npx playwright install --with-deps chrome
      # O Playwright faz o build de produção e sobe o servidor antes dos testes.
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
