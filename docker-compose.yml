# Serviços de desenvolvimento: PostgreSQL e um storage compatível com S3 (RustFS).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: noel
      POSTGRES_PASSWORD: noel
      POSTGRES_DB: oficina_do_noel
    ports:
      - "54329:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noel -d oficina_do_noel"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Storage compatível com S3 para desenvolvimento. O bucket é criado por
  # `npm run storage:init` (executado junto com `npm run db:up`).
  storage:
    image: rustfs/rustfs:latest
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: noel
      RUSTFS_SECRET_KEY: noel-storage
    ports:
      - "59000:9000"
    volumes:
      - storage_files:/data

volumes:
  db_data:
  storage_files:
