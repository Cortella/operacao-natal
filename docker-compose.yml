services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: noel
      POSTGRES_PASSWORD: noel
      POSTGRES_DB: oficina_do_noel
    ports:
      - "54329:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noel -d oficina_do_noel"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  db_data:
